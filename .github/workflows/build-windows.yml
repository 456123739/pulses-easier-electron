name: 打包 Windows beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（如 0.7.0-glass）
        required: false
        default: "0.7.0-glass"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: npm ci || npm install

      - name: 语法检查
        run: |
          node -e "
            const fs=require('fs'),path=require('path');
            function walk(d){for(const f of fs.readdirSync(d)){const p=path.join(d,f);if(fs.statSync(p).isDirectory())walk(p);else if(f.endsWith('.js'))files.push(p)}}
            let files=[];walk('src');let ok=0,fail=0;
            for(const f of files){try{new Function(fs.readFileSync(f,'utf-8'));ok++}catch(e){fail++;console.log('ERR:',f,e.message)}}
            console.log('JS:',ok,'ok,',fail,'fail');if(fail)process.exit(1)
          "

      - name: electron-builder 打包
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: pulses-easier-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          prerelease: true
